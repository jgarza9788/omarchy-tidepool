; Tidepool visualizer: raw ascii bars on stdout, ';' between bars, newline per frame.
; bars must equal `bars:` in components/PlayerTab.qml (Visualizer), or the extra columns stay flat.
[general]
bars = 48
framerate = 30
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 60
