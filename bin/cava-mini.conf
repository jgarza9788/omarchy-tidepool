; Tidepool's mini visualizer on the bar: few bars, low frame rate (cheap).
; bars must equal `bars:` on the MiniViz in BarWidget.qml, or the extra columns stay flat.
[general]
bars = 8
framerate = 24
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
