name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifest is valid JSON
        run: python3 -c "import json; json.load(open('manifest.json'))"
      - name: Model tests
        run: node tests/model.test.js
      - name: Helper tests
        run: python3 -I -B -m unittest discover tests
